[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeit-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for DIE ZEIT — headlines, 10 sections, keyword search (main feed + all sections) via the official RSS feeds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
zeit-mcp = "zeit_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zeit_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real newsfeed.zeit.de feeds"]
